<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SG · HQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#0E1A33,#01050E 70%);min-height:100vh;font-family:Bahnschrift,'Segoe UI',sans-serif;color:#fff;padding:18px;max-width:430px;margin:0 auto}
.badge{display:inline-block;background:linear-gradient(135deg,#1C9DF7,#5FD4F0);color:#01050E;font-weight:900;font-size:10px;letter-spacing:1px;padding:4px 10px;border-radius:12px;margin-bottom:14px}
.hero{background:linear-gradient(160deg,rgba(17,28,52,.92),rgba(6,11,22,.97));border:1px solid rgba(118,128,142,.4);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(197,204,212,.15)}
.hero .lbl{font-size:9px;font-weight:900;color:#7BCFFF;letter-spacing:2.5px}
.hero .val{font-size:44px;font-weight:900;letter-spacing:-1.5px;text-shadow:0 0 28px rgba(28,157,247,.5)}
.hero .val span{font-size:18px;color:#76808E}
.bar{height:9px;background:#060B16;border-radius:5px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:3%;background:linear-gradient(90deg,#F59E0B,#FBBF24);border-radius:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:rgba(10,17,27,.8);border:1px solid rgba(118,128,142,.3);border-radius:13px;padding:13px;text-align:center}
.tile .v{font-size:26px;font-weight:900;color:#5FD4F0}
.tile .l{font-size:8.5px;font-weight:900;color:#93A2B5;letter-spacing:1.8px;margin-top:3px}
.hot{border-color:rgba(16,185,129,.5)!important}.hot .v{color:#34D399}
.foot{text-align:center;font-size:9.5px;color:#5A6470;margin-top:14px;letter-spacing:.5px}
</style></head><body>
<div class="badge">⚡ SINGULARITY HQ · FRI 12 JUN 13:25</div>
<div class="hero">
  <div class="lbl">FIRST CLIENT · DEADLINE TOMORROW</div>
  <div class="val">$0 <span>/ $1,500</span></div>
  <div class="bar"><i></i></div>
</div>
<div class="grid">
  <div class="tile"><div class="v">274</div><div class="l">ACTIVE PIPELINE</div></div>
  <div class="tile"><div class="v">284</div><div class="l">SENDS · 50/DAY</div></div>
  <div class="tile"><div class="v">201</div><div class="l">LIVE DEMOS</div></div>
  <div class="tile hot"><div class="v">1 🔥</div><div class="l">HOT REPLY</div></div>
  <div class="tile"><div class="v">29</div><div class="l">AUTO-CLOSED</div></div>
  <div class="tile"><div class="v">20</div><div class="l">ROBOTS LIVE</div></div>
</div>
<div class="foot">refreshed by the 1pm + 9pm robots · numbers only, no names · Singularity Systems</div>
</body></html>
